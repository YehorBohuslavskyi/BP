[server]
address = "127.0.0.1"
maxUploadSize = 1

[browser]
gatherUsageStats = false

# Native theme based on the skill's shadcn template, with a blue accent.
[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#0f172a"
font = "sans-serif"
codeBackgroundColor = "#f8fafc"
borderColor = "#e2e8f0"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "8px"
headingFontWeights = [650, 600, 600, 600, 600, 600]
dataframeHeaderBackgroundColor = "#f1f5f9"

[theme.sidebar]
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#f8fafc"
primaryColor = "#60a5fa"
borderColor = "#334155"
